# ================================================================
#  Render.com Blueprint — one-click deploy for the JARVIS web app
#  Dashboard: New +  →  Blueprint  →  pick this repo  →  Apply
#  Every future `git push` to main auto-redeploys. Easy upgrades. 🚀
# ================================================================
services:
  - type: web
    name: jarvis
    runtime: python
    plan: free
    rootDir: web
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JARVIS_LLM_PROVIDER
        value: gemini
      - key: USER_NAME
        value: Phavi
      - key: CITY
        value: Chennai
      # Set these in the Render dashboard (Environment) — NEVER commit keys.
      # Automatic failover: if Gemini fails, Groq answers, then OpenAI.
      - key: JARVIS_API_KEY        # gemini key (primary brain)
        sync: false
      - key: GROQ_API_KEY          # groq key  (backup brain #1)
        sync: false
      - key: OPENAI_API_KEY        # openai key (backup brain #2, optional)
        sync: false
      # Email reading ("jarvis, read my emails") — Gmail + App Password:
      - key: EMAIL_USER            # your gmail address
        sync: false
      - key: EMAIL_APP_PASSWORD    # from myaccount.google.com/apppasswords
        sync: false
