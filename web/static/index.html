<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Personal AI Interface</title>
<style>
  :root{
    --cy:#00d9ff; --cy2:#8ff3ff; --cydim:rgba(0,217,255,.25);
    --bg:#020610; --panel:rgba(7,18,35,.78); --line:rgba(0,217,255,.18);
    --txt:#cfeeff;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);overflow:hidden}
  #stars{position:fixed;inset:0;z-index:0}
  .grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(0,217,255,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(0,217,255,.045) 1px,transparent 1px);
    background-size:44px 44px;}
  .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto;padding:14px 16px}

  /* ── header ── */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .title{font-size:22px;letter-spacing:.42em;font-weight:700;color:var(--cy2);
         text-shadow:0 0 18px var(--cydim)}
  .title small{display:block;font-size:9px;letter-spacing:.32em;color:#5e9db8;margin-top:2px}
  .hud-right{display:flex;align-items:center;gap:14px;font-size:12px}
  #clock{color:#6fc7e6;letter-spacing:.14em;font-variant-numeric:tabular-nums}
  .pill{padding:5px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel);
        font-size:11px;letter-spacing:.18em;color:var(--cy)}
  .pill .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2bffa8;
             box-shadow:0 0 8px #2bffa8;margin-right:6px;animation:blink 2s infinite}
  .pill.down .dot{background:#ff5d5d;box-shadow:0 0 8px #ff5d5d}
  @keyframes blink{50%{opacity:.35}}

  /* ── arc reactor ── */
  .reactor-zone{position:relative;height:230px;display:flex;align-items:center;justify-content:center;margin:4px 0 2px}
  .ring{position:absolute;border-radius:50%;border:2px solid transparent}
  .r1{width:196px;height:196px;border-top-color:var(--cy);border-right-color:var(--cydim);animation:spin 7s linear infinite}
  .r2{width:166px;height:166px;border-bottom-color:var(--cy2);border-left-color:var(--cydim);animation:spinrev 5s linear infinite}
  .r3{width:132px;height:132px;border:1px dashed rgba(0,217,255,.4);animation:spin 11s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinrev{to{transform:rotate(-360deg)}}
  #core{position:relative;width:104px;height:104px;border-radius:50%;cursor:pointer;border:none;
    background:radial-gradient(circle at 50% 38%,#eaffff 0%,#a9f4ff 18%,#19c8ef 42%,#056b8f 70%,#023448 100%);
    box-shadow:0 0 24px 4px rgba(0,217,255,.55),0 0 90px 18px rgba(0,217,255,.18),inset 0 0 18px rgba(255,255,255,.55);
    transition:transform .15s ease}
  #core:hover{transform:scale(1.05)}
  #core:active{transform:scale(.97)}
  #core .icon{font-size:34px;filter:drop-shadow(0 0 6px #fff)}
  .reactor-zone.listening #core{animation:pulseL .9s ease-in-out infinite}
  .reactor-zone.speaking #core{animation:pulseS .6s ease-in-out infinite}
  .reactor-zone.listening .r1{animation-duration:2.4s}
  .reactor-zone.speaking .r2{animation-duration:1.8s}
  @keyframes pulseL{0%,100%{box-shadow:0 0 24px 4px rgba(0,217,255,.55),0 0 90px 18px rgba(0,217,255,.18)}
                    50%{box-shadow:0 0 40px 12px rgba(0,255,190,.75),0 0 120px 30px rgba(0,255,190,.3)}}
  @keyframes pulseS{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  #status{text-align:center;font-size:11px;letter-spacing:.35em;color:#58a9c6;margin-bottom:6px}

  /* ── chat ── */
  #chat{flex:1;overflow-y:auto;padding:10px 6px;display:flex;flex-direction:column;gap:9px;
        scrollbar-width:thin;scrollbar-color:var(--cydim) transparent}
  .msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:14.5px;line-height:1.5;
       white-space:pre-line;animation:fadeUp .25s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
  .msg.jarvis{align-self:flex-start;background:var(--panel);border:1px solid var(--line);
              border-left:3px solid var(--cy);border-radius:4px 14px 14px 14px}
  .msg.user{align-self:flex-end;background:rgba(0,217,255,.13);border:1px solid rgba(0,217,255,.35);
            border-radius:14px 4px 14px 14px}
  .msg .who{display:block;font-size:9px;letter-spacing:.3em;color:#5e9db8;margin-bottom:4px}
  a.chip{display:inline-block;margin-top:8px;padding:7px 14px;border:1px solid var(--cy);
         border-radius:8px;color:var(--cy2);text-decoration:none;font-size:13px;
         background:rgba(0,217,255,.08);transition:.2s}
  a.chip:hover{background:rgba(0,217,255,.22);box-shadow:0 0 14px var(--cydim)}

  /* ── quick commands ── */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .qbtn{padding:7px 13px;font-size:12.5px;color:var(--cy2);background:rgba(0,217,255,.07);
        border:1px solid var(--line);border-radius:18px;cursor:pointer;letter-spacing:.04em;transition:.2s}
  .qbtn:hover{background:rgba(0,217,255,.2);box-shadow:0 0 12px var(--cydim)}

  /* ── input bar ── */
  .bar{display:flex;gap:9px}
  #txt{flex:1;padding:13px 16px;font-size:15px;color:var(--txt);background:var(--panel);
       border:1px solid var(--line);border-radius:12px;outline:none}
  #txt:focus{border-color:var(--cy);box-shadow:0 0 14px var(--cydim)}
  .cbtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);cursor:pointer;
        background:var(--panel);color:var(--cy);font-size:19px;transition:.2s}
  .cbtn:hover{background:rgba(0,217,255,.18);box-shadow:0 0 12px var(--cydim)}
  .cbtn.off{opacity:.4}
  footer{text-align:center;font-size:10px;color:#3d6a80;letter-spacing:.22em;margin-top:8px}

  /* ── boot overlay ── */
  #boot{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;
        justify-content:center;flex-direction:column;gap:18px;transition:opacity .7s ease}
  #boot.hide{opacity:0;pointer-events:none}
  #boot h1{font-size:30px;letter-spacing:.5em;color:var(--cy2);text-shadow:0 0 30px var(--cydim);animation:blink 1.4s infinite}
  #bootlog{font-family:Consolas,monospace;font-size:12px;color:#4fb3d4;min-height:110px;white-space:pre;line-height:1.9}
  @media (max-width:560px){ .title{font-size:16px;letter-spacing:.3em} .msg{max-width:92%} }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="grid"></div>

<div id="boot">
  <h1>J.A.R.V.I.S.</h1>
  <div id="bootlog"></div>
</div>

<div class="wrap">
  <header>
    <div class="title">J.A.R.V.I.S.<small>JUST A RATHER VERY INTELLIGENT SYSTEM</small></div>
    <div class="hud-right"><span id="clock">--:--:--</span><span class="pill" id="net"><span class="dot"></span>ONLINE</span></div>
  </header>

  <div class="reactor-zone" id="rz">
    <div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
    <button id="core" title="Click to talk"><span class="icon">🎙️</span></button>
  </div>
  <div id="status">STANDBY — CLICK REACTOR OR TYPE A COMMAND</div>

  <div id="chat"></div>

  <div class="chips">
    <button class="qbtn">🌤 Weather</button>
    <button class="qbtn">📰 News</button>
    <button class="qbtn">😄 Tell me a joke</button>
    <button class="qbtn">🕐 What time is it</button>
    <button class="qbtn">🎵 Play Believer</button>
    <button class="qbtn">⚡ Help</button>
  </div>

  <div class="bar">
    <input id="txt" placeholder="Type a command… e.g. «remind me to drink water in 10 minutes»" autocomplete="off">
    <button class="cbtn" id="micbtn" title="Voice input">🎤</button>
    <button class="cbtn" id="sndbtn" title="Toggle voice replies">🔊</button>
    <button class="cbtn" id="send" title="Send">➤</button>
  </div>
  <footer>ARC REACTOR CORE · STARK INDUSTRIES INTERFACE · v1.0</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const chat = $('#chat'), rz = $('#rz'), statusEl = $('#status');
let soundOn = true, speaking = false, listening = false, userGestureAt = 0;

/* ───────────── starfield ───────────── */
const cv = $('#stars'), cx = cv.getContext('2d'); let stars = [];
function starsInit(){ cv.width = innerWidth; cv.height = innerHeight;
  stars = Array.from({length:70},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.3,s:Math.random()*.25+.05}));
}
addEventListener('resize', starsInit); starsInit();
(function loop(){ cx.clearRect(0,0,cv.width,cv.height); cx.fillStyle='#0a1830'; 
  for(const st of stars){ st.y+=st.s; if(st.y>cv.height){st.y=0;st.x=Math.random()*cv.width;}
    cx.beginPath(); cx.fillStyle='rgba(120,220,255,'+(st.r/2)+')'; cx.arc(st.x,st.y,st.r,0,7); cx.fill(); }
  requestAnimationFrame(loop); })();

/* ───────────── clock / health ───────────── */
setInterval(()=>{ $('#clock').textContent = new Date().toLocaleTimeString('en-IN',{hour12:true}).toUpperCase(); },1000);
async function health(){ try{ const r = await fetch('/api/health'); const d = await r.json();
    $('#net').classList.remove('down'); $('#net').innerHTML='<span class="dot"></span>'+(d.ai==='offline'?'ONLINE · AI OFF':'ONLINE · '+d.ai.toUpperCase());
  }catch(e){ $('#net').classList.add('down'); $('#net').innerHTML='<span class="dot"></span>LINK DOWN'; } }
health(); setInterval(health, 30000);

/* ───────────── speech synthesis ───────────── */
let voice = null;
function pickVoice(){ const vs = speechSynthesis.getVoices();
  const pref = ['Google UK English Male','Daniel','Microsoft Ryan','Microsoft David','Google UK English','Google US English'];
  for(const p of pref){ const v = vs.find(v=>v.name.includes(p)); if(v) return v; }
  return vs.find(v=>v.lang.startsWith('en')) || null; }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = ()=>{ voice = pickVoice(); }; voice = pickVoice(); }
const speakQueue = [];
function speak(text){
  if(!soundOn || !('speechSynthesis' in window)) return;
  speakQueue.push(text); if(!speaking) nextSpeak();
}
function nextSpeak(){
  const t = speakQueue.shift();
  if(t === undefined){ speaking=false; rz.classList.remove('speaking'); setStatus(); return; }
  speaking = true; rz.classList.add('speaking'); setStatus();
  const u = new SpeechSynthesisUtterance(t.replace(/[*_`#>~➤↗▶🔍⚡🎙️⏰]/g,''));
  if(voice) u.voice = voice; u.rate = 1; u.pitch = .9; u.volume = 1;
  u.onend = nextSpeak; u.onerror = nextSpeak; speechSynthesis.speak(u);
}

/* ───────────── speech recognition ───────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if(SR){ rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => { const t = e.results[0][0].transcript; stopListen(); doSend(t); };
  rec.onend = ()=> stopListen(); rec.onerror = ()=> stopListen();
} else { $('#micbtn').style.display='none'; $('#core').style.pointerEvents='auto'; }
function startListen(){
  if(!rec){ addMsg('jarvis','Voice input needs Chrome or Edge, sir. You can still type to me.'); return; }
  try{ rec.start(); listening = true; rz.classList.add('listening'); setStatus(); }catch(e){}
}
function stopListen(){ if(listening && rec){ try{rec.stop();}catch(e){} } listening=false; rz.classList.remove('listening'); setStatus(); }
$('#core').onclick = ()=>{ userGestureAt = Date.now();
  if(speaking){ speechSynthesis.cancel(); speakQueue.length=0; speaking=false; rz.classList.remove('speaking'); setStatus(); return; }
  listening ? stopListen() : startListen(); };
$('#micbtn').onclick = ()=> startListen();

/* ───────────── ui helpers ───────────── */
function setStatus(){
  statusEl.textContent = listening ? '◉ LISTENING — SPEAK NOW'
    : speaking ? '▶ SPEAKING…'
    : rec ? 'STANDBY — CLICK REACTOR OR TYPE A COMMAND' : 'STANDBY — TYPE A COMMAND';
}
function addMsg(who, text, actions){
  const div = document.createElement('div'); div.className = 'msg '+who;
  if(who==='jarvis'){ const w=document.createElement('span'); w.className='who'; w.textContent='J.A.R.V.I.S.'; div.appendChild(w); }
  div.appendChild(document.createTextNode(text));
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight; return div;
}
function addActions(div, actions){
  for(const a of (actions||[])){
    if(a.type==='open_url'){ const link=document.createElement('a'); link.className='chip';
      link.href=a.url; link.target='_blank'; link.rel='noopener'; link.textContent=a.label||a.url;
      div.appendChild(document.createElement('br')); div.appendChild(link);
      if(Date.now()-userGestureAt < 2500){ try{ window.open(a.url,'_blank'); }catch(e){} }
    }
  }
}

/* ───────────── core send ───────────── */
async function doSend(text){
  text = (text||'').trim(); if(!text) return;
  addMsg('user', text); $('#txt').value='';
  try{
    const r = await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const d = await r.json();
    for(const rep of d.replies||[]){
      const div = addMsg('jarvis', rep); addActions(div, d.actions.filter(a=>d.replies.indexOf(rep)===d.replies.length-1));
      speak(rep);
    }
    if(!(d.replies||[]).length && d.actions && d.actions.length){ const div=addMsg('jarvis','Right away, sir.'); addActions(div,d.actions); }
  }catch(e){ addMsg('jarvis','I seem to have lost my connection to the server, sir. Is the backend running?'); }
}
$('#send').onclick = ()=>{ userGestureAt=Date.now(); doSend($('#txt').value); };
$('#txt').addEventListener('keydown', e=>{ if(e.key==='Enter'){ userGestureAt=Date.now(); doSend($('#txt').value); } });
document.querySelectorAll('.qbtn').forEach(b=> b.onclick = ()=>{ userGestureAt=Date.now(); doSend(b.textContent.replace(/^[^\w]+/,'').trim()); });
$('#sndbtn').onclick = function(){ soundOn=!soundOn; this.textContent = soundOn?'🔊':'🔇'; this.classList.toggle('off',!soundOn);
  if(!soundOn){ speechSynthesis.cancel(); speakQueue.length=0; } };

/* ───────────── reminders polling ───────────── */
setInterval(async ()=>{ try{ const r = await fetch('/api/events'); const d = await r.json();
  for(const ev of d.events||[]){ addMsg('jarvis', ev); speak(ev); } }catch(e){} }, 5000);

/* ───────────── boot sequence ───────────── */
const lines = ['> initializing arc reactor core ............ OK','> calibrating neural interface ........... OK',
 '> loading memory banks ................... OK','> establishing secure uplink ............. OK','> all systems online.'];
let bi=0; const blog=$('#bootlog');
(function typeBoot(){ if(bi<lines.length){ blog.textContent += lines[bi++]+'\n'; setTimeout(typeBoot, 300); }
  else setTimeout(()=>{ $('#boot').classList.add('hide');
    const h=new Date().getHours(), tod= h<12?'Good morning': h<17?'Good afternoon':'Good evening';
    const g = tod+', sir. I am JARVIS — online and at your command. Ask me anything, or press the reactor to speak.';
    addMsg('jarvis', g); speak(g);
  }, 500); })();
setStatus();
</script>
</body>
</html>
